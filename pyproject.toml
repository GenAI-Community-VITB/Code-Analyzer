[project]
name = "code-analyzer"
version = "1.0.0"
description = "GitHub repository hybrid analysis (static + Gemini)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "google-generativeai>=0.8.0",
]

[project.scripts]
code-analyzer = "app.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
